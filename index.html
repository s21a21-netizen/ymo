<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Distribution Page</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin-top: 0;
        }
        .track {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .track:last-child {
            border-bottom: none;
        }
        .track-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .track-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        audio {
            width: 100%;
            margin-bottom: 8px;
        }
        .download-btn {
            display: inline-block;
            background-color: #007aff;
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            text-decoration: none;
            border-radius: 4px;
        }
        .download-btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Audio Tracks</h1>
    
    <!-- トラック1 -->
    <div class="track">
        <div class="track-title">Technopolis</div>
        <div class="track-info">Format: M4A / Bitrate: 320kbps</div>
        <!-- 古いiOSでも再生しやすいように標準のcontrolsを使用 -->
        <audio controls preload="none">
            <source src="https://files.catbox.moe/uizhb9.m4a" type="audio/mpeg">
            お使いのブラウザは音声再生に対応していません。
        </audio>
        <div>
            <a href="audio1.mp3" class="download-btn" download>ダウンロード (.mp3)</a>
        </div>
    </div>

    <!-- トラック2 -->
    <div class="track">
        <div class="track-title">RYDEEN</div>
        <div class="track-info">Format: M4A / Bitrate: 320kbps</div>
        <audio controls preload="none">
            <source src="https://files.catbox.moe/o6yy1d.m4a" type="audio/mpeg">
            お使いのブラウザは音声再生に対応していません。
        </audio>
        <div>
            <a href="audio2.mp3" class="download-btn" download>ダウンロード (.mp3)</a>
        </div>
    </div>

</div>

</body>
</html>
