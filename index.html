<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMO-Style MIDI to FSK Audio Converter (Vanilla)</title>
    <style>
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px dashed #00ffcc;
            padding: 30px;
            border-radius: 10px;
            background-color: #1e1e1e;
        }
        input[type="file"] {
            margin: 20px 0;
            color: #fff;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #00cca3;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ff0055;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YMO-STYLE SYNC CONVERTER</h1>
        <p>MIDIファイルをドロップして、ピーギャー音(WAV)に変換！</p>
        
        <input type="file" id="midiFileInput" accept=".mid, .midi"><br>
        <button id="convertBtn" disabled>ピーギャー音に変換してWAV出力</button>
        
        <div id="status">MIDIファイルを選んでね</div>
        <audio id="audioPreview" controls style="margin-top:20px; width:100%; display:none;"></audio>
    </div>

    <script>
        const midiFileInput = document.getElementById('midiFileInput');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');
        const audioPreview = document.getElementById('audioPreview');

        let rawMidiBuffer = null;

        midiFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "ファイルを読み込んでいます...";
            const reader = new FileReader();
            reader.onload = function(event) {
                rawMidiBuffer = event.target.result;
                statusDiv.innerText = `ファイル読み込み成功: ${file.name}`;
                convertBtn.disabled = false;
            };
            reader.onerror = function() {
                statusDiv.innerText = "エラー: ファイルの読み込みに失敗しました。";
            };
            reader.readAsArrayBuffer(file);
        });

        convertBtn.addEventListener('click', async () => {
            if (!rawMidiBuffer) return;

            statusDiv.innerText = "MIDIを解析してピーギャー音を生成中...";
            convertBtn.disabled = true;

            try {
                // 簡易MIDIパーサー（標準のArrayBufferからノート情報を抜き出す）
                const notes = parseMidiSimple(rawMidiBuffer);
                
                if (notes.length === 0) {
                    statusDiv.innerText = "エラー: 有効なノートが見つからなかったよ！";
                    convertBtn.disabled = false;
                    return;
                }

                // 曲の長さを計算（最後のノートの終了時間 + 2秒余白）
                let maxTime = 5;
                notes.forEach(n => {
                    const endTime = n.time + n.duration;
                    if (endTime > maxTime) maxTime = endTime;
                });
                maxTime += 2;

                // オフラインオーディオコンテキストでWAVを描画
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(1, sampleRate * maxTime, sampleRate);

                notes.forEach(n => {
                    const freq = 440 * Math.pow(2, (n.noteNumber - 69) / 12);
                    
                    const osc = offlineCtx.createOscillator();
                    const gain = offlineCtx.createGain();

                    // YMOっぽい矩形波
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, n.time);

                    gain.gain.setValueAtTime(0, n.time);
                    gain.gain.linearRampToValueAtTime(0.3, n.time + 0.01);
                    gain.gain.setValueAtTime(0.3, n.time + n.duration - 0.01);
                    gain.gain.linearRampToValueAtTime(0, n.time + n.duration);

                    osc.connect(gain);
                    gain.connect(offlineCtx.destination);

                    osc.start(n.time);
                    osc.stop(n.time + n.duration);
                });

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const audioUrl = URL.createObjectURL(wavBlob);

                audioPreview.src = audioUrl;
                audioPreview.style.display = 'block';
                statusDiv.innerText = "変換完了！下のプレイヤーで試聴・ダウンロードできるよ！";
            } catch (err) {
                statusDiv.innerText = "変換エラーが発生しました（コンソールを確認してね）";
                console.error(err);
            } finally {
                convertBtn.disabled = false;
            }
        });

        // 外部ライブラリなしで標準SMF (Format 0 / Format 1) からノートを取り出す自前パーサー
        function parseMidiSimple(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            let offset = 0;

            function readString(len) {
                let s = "";
                for (let i = 0; i < len; i++) s += String.fromCharCode(view.getUint8(offset++));
                return s;
            }

            function readUint32() {
                const val = view.getUint32(offset);
                offset += 4;
                return val;
            }

            function readUint16() {
                const val = view.getUint16(offset);
                offset += 2;
                return val;
            }

            function readVariableLength() {
                let value = 0;
                let b;
                do {
                    b = view.getUint8(offset++);
                    value = (value << 7) + (b & 0x7F);
                } while (b & 0x80);
                return value;
            }

            const chunkType = readString(4);
            if (chunkType !== "MThd") throw new Error("Not a valid MIDI file");

            const headerLen = readUint32();
            const format = readUint16();
            const numTracks = readUint16();
            const division = readUint16();
            offset = 8 + headerLen; // ヘッダーをスキップ

            let ticksPerBeat = division;
            if (division & 0x8000) {
                ticksPerBeat = 480; // フォールバック
            }

            let allNotes = [];
            let tempo = 500000; // デフォルト 120BPM (500,000 microseconds per quarter note)

            for (let t = 0; t < numTracks; t++) {
                const trackType = readString(4);
                const trackLen = readUint32();
                const trackEnd = offset + trackLen;

                if (trackType !== "MTrk") {
                    offset = trackEnd;
                    continue;
                }

                let currentTick = 0;
                let activeNotes = {};
                let runningStatus = 0;
                let seconds = 0;

                while (offset < trackEnd) {
                    const deltaTicks = readVariableLength();
                    currentTick += deltaTicks;
                    
                    // デルタタイムを秒に換算（簡易）
                    seconds += (deltaTicks / ticksPerBeat) * (tempo / 1000000);

                    let eventHeader = view.getUint8(offset++);
                    
                    if (eventHeader === 0xFF) {
                        // メタイベント
                        let metaType = view.getUint8(offset++);
                        let length = readVariableLength();
                        if (metaType === 0x51 && length === 3) {
                            tempo = (view.getUint8(offset) << 16) | (view.getUint8(offset+1) << 8) | view.getUint8(offset+2);
                        }
                        offset += length;
                    } else if (eventHeader === 0xF0 || eventHeader === 0xF7) {
                        // SysEx
                        let length = readVariableLength();
                        offset += length;
                    } else {
                        let status = eventHeader;
                        if ((status & 0x80) === 0) {
                            // ランニングステータス
                            status = runningStatus;
                            offset--;
                        } else {
                            runningStatus = status;
                        }

                        const cmd = status & 0xF0;
                        if (cmd === 0x90 || cmd === 0x80) {
                            let noteNumber = view.getUint8(offset++);
                            let velocity = view.getUint8(offset++);
                            if (cmd === 0x80) velocity = 0;

                            if (velocity > 0) {
                                activeNotes[noteNumber] = seconds;
                            } else {
                                if (activeNotes[noteNumber] !== undefined) {
                                    allNotes.push({
                                        noteNumber: noteNumber,
                                        time: activeNotes[noteNumber],
                                        duration: Math.max(0.05, seconds - activeNotes[noteNumber])
                                    });
                                    delete activeNotes[noteNumber];
                                }
                            }
                        } else if (cmd === 0xC0 || cmd === 0xD0) {
                            offset += 1;
                        } else if (cmd === 0xE0 || cmd === 0x80 || cmd === 0x90 || cmd === 0xA0 || cmd === 0xB0) {
                            offset += 2;
                        }
                    }
                }
                offset = trackEnd;
            }
            return allNotes;
        }

        // AudioBuffer -> WAV変換
        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
                sampleRate = abuffer.sampleRate,
                format = 1,
                bitDepth = 16,
                bytesPerSample = bitDepth / 8,
                blockAlign = numOfChan * bytesPerSample,
                buffer = new ArrayBuffer(44 + len * bytesPerSample),
                view = new DataView(buffer),
                channels = [], sample, offset = 0, pos = 0;

            function writeString(str) {
                for (let i = 0; i < str.length; i++) view.setUint8(pos++, str.charCodeAt(i));
            }

            writeString('RIFF');
            view.setUint32(pos, 44 + len * bytesPerSample, true); pos += 4;
            writeString('WAVE');
            writeString('fmt ');
            view.setUint32(pos, 16, true); pos += 4;
            view.setUint16(pos, format, true); pos += 2;
            view.setUint16(pos, numOfChan, true); pos += 2;
            view.setUint32(pos, sampleRate, true); pos += 4;
            view.setUint32(pos, sampleRate * blockAlign, true); pos += 4;
            view.setUint16(pos, blockAlign, true); pos += 2;
            view.setUint16(pos, bitDepth, true); pos += 2;
            writeString('data');
            view.setUint32(pos, len * bytesPerSample, true); pos += 4;

            for (let i = 0; i < numOfChan; i++) channels.push(abuffer.getChannelData(i));

            while (pos < buffer.byteLength) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767);
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
