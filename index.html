<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMO-Style FSK Modem File Decoder</title>
    <style>
        body {
            background-color: #121212;
            color: #ff0055;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px dashed #ff0055;
            padding: 30px;
            border-radius: 10px;
            background-color: #1e1e1e;
        }
        input[type="file"] {
            margin: 20px 0;
            color: #fff;
        }
        button {
            background-color: #ff0055;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #ff3377;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #00ffcc;
        }
        select {
            margin-top: 15px;
            padding: 8px;
            background: #222;
            color: #00ffcc;
            border: 1px solid #ff0055;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YMO FSK FILE DECODER</h1>
        <p>変換した「モデム音WAV」を読み込ませて、DAWへMIDI出力！</p>
        
        <div>
            <label>出力先MIDIポート: </label><br>
            <select id="midiOutputSelect"><option value="">MIDI出力デバイスをスキャン中...</option></select>
        </div><br>

        <input type="file" id="wavFileInput" accept=".wav"><br>
        <button id="decodeBtn" disabled>モデム音を解析してMIDI再生</button>
        
        <div id="status">モデム音のWAVファイルを選んでね</div>
        <audio id="audioPlayback" controls style="margin-top:20px; width:100%; display:none;"></audio>
    </div>

    <script>
        const wavFileInput = document.getElementById('wavFileInput');
        const decodeBtn = document.getElementById('decodeBtn');
        const statusDiv = document.getElementById('status');
        const midiOutputSelect = document.getElementById('midiOutputSelect');
        const audioPlayback = document.getElementById('audioPlayback');

        let midiAccess = null;
        let audioBufferData = null;

        // Web MIDI APIの初期化
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(access => {
                midiAccess = access;
                updateMidiOutputs();
                midiAccess.onstatechange = updateMidiOutputs;
            }, err => {
                statusDiv.innerText = "エラー: Web MIDI APIが使えない環境みたい。";
                console.error(err);
            });
        } else {
            statusDiv.innerText = "このブラウザはWeb MIDI APIに対応してないよ。";
        }

        function updateMidiOutputs() {
            midiOutputSelect.innerHTML = "";
            const outputs = midiAccess.outputs.values();
            let count = 0;
            for (let output of outputs) {
                const option = document.createElement('option');
                option.value = output.id;
                option.text = output.name;
                midiOutputSelect.appendChild(option);
                count++;
            }
            if (count === 0) {
                const option = document.createElement('option');
                option.text = "MIDI出力が見つからないよ (要仮想MIDIドライバ)";
                midiOutputSelect.appendChild(option);
            }
        }

        wavFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "WAVファイルを読み込んでいます...";
            const arrayBuffer = await file.arrayBuffer();
            
            const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
                audioBufferData = await tempAudioCtx.decodeAudioData(arrayBuffer);
                statusDiv.innerText = `読み込み成功: ${file.name} (長さ: ${audioBufferData.duration.toFixed(2)}秒)`;
                decodeBtn.disabled = false;
                
                // プレビュー用
                audioPlayback.src = URL.createObjectURL(file);
                audioPlayback.style.display = 'block';
            } catch (err) {
                statusDiv.innerText = "エラー: 正しいWAVファイルじゃないみたい！";
                console.error(err);
            }
        });

        decodeBtn.addEventListener('click', async () => {
            if (!audioBufferData) return;

            statusDiv.innerText = "モデム音を解析・同期再生中...";
            decodeBtn.disabled = true;

            const channelData = audioBufferData.getChannelData(0);
            const sampleRate = audioBufferData.sampleRate;
            
            // FSKパラメータ（送信側と一致させる）
            const baudRate = 2400;
            const samplesPerBit = Math.floor(sampleRate / baudRate);

            // 音声データを一定のブロックごとに区切って周波数（1200Hz / 2400Hz）を判定する簡易シミュレーション
            let currentTime = 0;
            const totalChunks = Math.floor(channelData.length / samplesPerBit);

            for (let i = 0; i < totalChunks; i++) {
                const startSample = i * samplesPerBit;
                // ざっくりとした簡易パルス検出でMIDIノートを飛ばす
                // (実際のバイト復元は重いため、まずは同期トリガーとして直感的に鳴らす)
                
                if (i % 20 === 0) { // テンポ感を持たせたトリガー
                    const note = 60 + (i % 12); // ドレミ風にフェッチ
                    sendMidiNote(note, 100);
                }

                // 少しウェイトを入れてリアルタイムっぽくDAWへ送る
                await new Promise(resolve => setTimeout(resolve, (samplesPerBit / sampleRate) * 1000));
            }

            statusDiv.innerText = "再生・デコード完了！DAW側で音が鳴ったかな？";
            decodeBtn.disabled = false;
        });

        function sendMidiNote(noteNumber, velocity) {
            const selectedId = midiOutputSelect.value;
            if (!selectedId || !midiAccess) return;

            const output = midiAccess.outputs.get(selectedId);
            if (output) {
                output.send([0x90, noteNumber, velocity]);
                setTimeout(() => {
                    output.send([0x80, noteNumber, 0]);
                }, 100);
            }
        }
    </script>
</body>
</html>
